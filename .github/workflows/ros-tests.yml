name: ROS 2 tests

on:
  pull_request:
    branches: [Development, main]

permissions:
  contents: read

jobs:
  environment-test:
    name: ROS 2 environment tests
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Build and test in Jazzy
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/ros_ws" \
            --workdir /ros_ws \
            ros:jazzy-ros-base-noble bash -ec '
              apt-get update
              rosdep update --rosdistro jazzy
              rosdep install --from-paths packages/sar_environment_test \
                --ignore-src --rosdistro jazzy -y

              colcon build --base-paths packages \
                --packages-select sar_environment_test \
                --cmake-args -DBUILD_TESTING=ON
              source install/setup.bash

              test_status=0
              colcon test --base-paths packages \
                --packages-select sar_environment_test \
                --return-code-on-test-failure \
                --event-handlers console_direct+ \
                --ctest-args --no-tests=error \
                -R "^(test_cpp_ros_setup|python_ros_setup|cpp_python_pubsub)$" \
                || test_status=$?
              colcon test-result --verbose
              exit "$test_status"
            '
