name: Docs build test

on:
  push:
    branches: [actions-queue-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict