name: Publish documentation

on:
  push:
    branches: [Development]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out documentation
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt

      - name: Build development documentation
        run: mkdocs build --site-dir site/development

      - name: Create the website entrance
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>JDR SAR Drone Documentation</title>
            </head>
            <body>
              <h1>JDR SAR Drone Documentation</h1>
              <p><a href="development/">Development documentation</a></p>
            </body>
          </html>
          EOF

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4