name: Publish documentation

on:
  push:
    branches: [Development, main]
  pull_request:
    branches: [Development, main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'push' && 'publish' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed documentation
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt

      - name: Check documentation build
        run: mkdocs build --site-dir "$RUNNER_TEMP/docs-check"

      - name: Check out stable documentation
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources/stable

      - name: Check out development documentation
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: Development
          path: sources/development

      - name: Build both published versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>JDR SAR Drone Documentation</title>
            </head>
            <body>
              <h1>JDR SAR Drone Documentation</h1>
          HTML

          for version in stable development; do
            source_dir="$GITHUB_WORKSPACE/sources/$version"

            # Bootstrap development publishing before the docs reach main.
            if [[ "$version" == stable && ! -f "$source_dir/mkdocs.yml" ]]; then
              echo '<p>Stable documentation will be available after the documentation setup reaches main.</p>' >> site/index.html
              continue
            fi

            # Each branch supplies its own pinned documentation dependencies.
            env_dir="$RUNNER_TEMP/docs-$version"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install -r "$source_dir/requirements-docs.txt"
            (
              cd "$source_dir"
              "$env_dir/bin/mkdocs" build --site-dir "$GITHUB_WORKSPACE/site/$version"
            )
            printf '<p><a href="%s/">%s documentation</a></p>\n' "$version" "$version" >> site/index.html
          done

          printf '</body>\n</html>\n' >> site/index.html

      - name: Upload website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
